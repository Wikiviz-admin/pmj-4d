<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMJ 4D</title>
<style>
  :root {
    --cyan:#00c3dc; --blue:#00a7db; --navy:#006393;
    --ink:#1f2a33; --muted:#71808c; --line:#e3e8ec; --soft:#f4f8fa;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 "Open Sans",Segoe UI,Arial,sans-serif; color:var(--ink); background:#fff;
         display:flex; flex-direction:column; min-height:100vh; }
  button { font:inherit; cursor:pointer; }
  [hidden] { display:none !important; }

  /* Huvud */
  header { display:flex; align-items:center; gap:10px; padding:10px 12px 8px; }
  header img { height:26px; }
  header .name { font-weight:700; color:var(--navy); letter-spacing:.02em; font-size:15px; }
  header .sp { flex:1; }
  .dot { width:9px; height:9px; border-radius:50%; background:#f2b705; }
  .dot.ok { background:#3aa845; } .dot.bad { background:#d64545; }
  .icon { background:none; border:0; color:var(--muted); padding:4px 6px; border-radius:4px; font-size:12px; }
  .icon:hover { background:var(--soft); color:var(--navy); }
  .stripe { height:4px; background:linear-gradient(90deg,var(--cyan) 0 38%, #fff 38% 39%, var(--blue) 39% 61%, #fff 61% 62%, var(--navy) 62%); }

  /* Flikar */
  nav { display:flex; border-bottom:1px solid var(--line); }
  nav button { flex:1; background:none; border:0; padding:10px 0 8px; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; }
  nav button.on { color:var(--navy); border-bottom-color:var(--blue); }
  main { padding:12px; }

  /* Knappar */
  .btn { background:var(--navy); color:#fff; border:0; border-radius:6px; padding:8px 14px; font-weight:600; }
  .btn:hover { background:#00557f; }
  .btn.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); font-weight:400; }
  .btn.full { width:100%; padding:11px; margin-top:12px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .bar { display:flex; gap:8px; margin-bottom:12px; }

  /* Statuskort (översikt) */
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { text-align:left; background:var(--soft); border:0; border-radius:8px; padding:9px 10px 8px; position:relative; overflow:hidden; }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c); }
  .card .n { font-size:20px; font-weight:700; color:var(--ink); line-height:1.1; }
  .card .t { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .card.off { opacity:.4; }
  .card.off .n { text-decoration:line-through; }
  .empty { color:var(--muted); text-align:center; padding:24px 8px; background:var(--soft); border-radius:8px; }
  .hint { font-size:11px; color:var(--muted); margin-top:8px; }

  /* Fyll i */
  .sel { font-size:22px; font-weight:700; color:var(--navy); }
  .sel small { font-size:12px; font-weight:400; color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
  .st { border:2px solid transparent; border-radius:8px; padding:9px 6px; background:var(--soft); font-weight:600; font-size:12px; display:flex; align-items:center; gap:7px; }
  .st i { width:12px; height:12px; border-radius:3px; background:var(--c); flex:none; }
  .st.on { border-color:var(--navy); background:#fff; }
  .row { display:flex; gap:6px; margin-top:12px; } .row > * { flex:1; min-width:0; }
  label { display:block; font-size:11px; color:var(--muted); margin:0 0 3px; }
  input[type=text], input[type=date], select { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  .auto { margin-top:8px; font-size:12px; color:var(--navy); background:#e6f7fb; border-radius:6px; padding:8px 9px; }
  .auto label { color:var(--navy); font-weight:600; font-size:12px; }
  .brush { width:100%; margin-top:10px; padding:9px; border-radius:8px; border:1px dashed var(--blue); background:#fff; color:var(--navy); font-weight:600; }
  .brush:disabled { opacity:.45; cursor:default; }
  .brush.on { background:var(--navy); color:#fff; border-style:solid; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 4px rgba(0,167,219,.25); } }
  /* 4D */
  .seg { display:flex; background:var(--soft); border-radius:8px; padding:3px; margin-bottom:12px; }
  .seg button { flex:1; border:0; background:none; padding:7px 0; border-radius:6px; color:var(--muted); font-weight:600; }
  .seg button.on { background:#fff; color:var(--navy); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .wkhead { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  .wk { font-size:22px; font-weight:700; color:var(--navy); }
  .strip { display:flex; gap:2px; overflow-x:auto; height:92px; align-items:stretch; padding:6px 4px 18px; background:var(--soft); border-radius:8px; scroll-behavior:smooth; }
  .wkc { flex:0 0 15px; display:flex; align-items:flex-end; justify-content:center; gap:1px; position:relative; cursor:pointer; border-radius:3px; }
  .wkc:hover { background:#e6f3f8; }
  .wkc .p { width:5px; background:#9fdcec; border-radius:1px; }
  .wkc .a { width:5px; background:#3aa845; border-radius:1px; }
  .wkc.past { opacity:.55; }
  .wkc.sel { background:#d3edf7; opacity:1; }
  .wkc.now::before { content:""; position:absolute; top:-4px; bottom:0; left:50%; border-left:2px dotted var(--cyan); }
  .wkc .l { position:absolute; bottom:-15px; font-size:9px; color:var(--muted); white-space:nowrap; }
  .wkc.sel .l { color:var(--navy); font-weight:700; }
  .legend { display:flex; gap:12px; font-size:11px; color:var(--muted); margin:6px 2px 0; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .ctrl { display:flex; gap:6px; margin:10px 0; }
  .ctrl .btn { padding:7px 12px; }
  .ctrl #tlPlay { flex:1; }
  #tlStats .card { cursor:default; }
  .switch { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12px; color:var(--muted); }

  /* Infokort för markerat element */
  .infowrap { position:sticky; bottom:0; margin-top:auto; background:#fff; padding:8px 12px 10px; z-index:5; flex:none; }
  .info { border-radius:12px; overflow:hidden; background:#fff; position:relative;
          box-shadow:0 -6px 18px rgba(0,40,70,.14), 0 0 0 1px rgba(0,99,147,.22); transition:box-shadow .3s; }
  .info.flash { animation:infoflash .9s ease-out; }
  @keyframes infoflash { 0% { box-shadow:0 0 0 4px var(--cyan), 0 -6px 18px rgba(0,40,70,.14); } 100% { box-shadow:0 -6px 18px rgba(0,40,70,.14), 0 0 0 1px rgba(0,99,147,.22); } }
  .ihead { display:flex; align-items:flex-start; gap:8px; padding:11px 12px 10px; color:#fff;
           background:linear-gradient(115deg, var(--navy) 0%, #0079ad 70%, var(--blue) 100%); border-bottom:4px solid var(--ic, var(--cyan)); }
  .iname { flex:1; min-width:0; }
  .ititle { font-size:15px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.01em; }
  .imark { font-size:15px; font-weight:700; color:#8ee8f5; margin-top:2px; letter-spacing:.05em; }
  .imark.none { color:rgba(255,255,255,.6); font-weight:400; font-style:italic; font-size:12px; letter-spacing:0; }
  .ihead .icon { color:rgba(255,255,255,.75); }
  .ihead .icon:hover { background:rgba(255,255,255,.15); color:#fff; }
  .ichip { font-size:10px; font-weight:700; letter-spacing:.05em; padding:3px 9px; border-radius:11px; color:#fff; background:var(--ic, #999);
           border:2px solid #fff; white-space:nowrap; margin-top:1px; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .ichip.light { color:var(--ink); }
  .ichip { cursor:default; font-family:inherit; }
  .ichip.can { cursor:pointer; }
  .ichip.can::after { content:" ▾"; }
  .ichip.can:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .imenu { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:8px 12px 10px; background:#eef8fb; border-bottom:1px solid var(--line); }
  .imenu button { display:flex; align-items:center; gap:6px; border:1.5px solid transparent; background:#fff; border-radius:6px; padding:6px 7px;
                  font:600 11.5px/1.2 inherit; text-align:left; color:var(--ink); cursor:pointer; }
  .imenu button:hover { border-color:var(--blue); }
  .imenu button i { width:10px; height:10px; border-radius:2px; background:var(--c); flex:none; }
  .imenu button.cur { border-color:var(--navy); background:#f4fbfd; }
  .icard.edit { cursor:pointer; transition:background .15s; }
  .icard.edit:hover { background:#e2f3f9; }
  .icard.edit .l::after { content:" ✎"; opacity:.55; }
  .icard input[type=date] { width:100%; padding:3px 4px; font-size:12px; margin-top:2px; border:1px solid var(--blue); border-radius:4px; }
  .itoast { position:absolute; right:10px; bottom:10px; background:var(--navy); color:#fff; font-size:11px; font-weight:600; padding:4px 10px;
            border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  .itoast.err { background:#d64545; }
  /* Inget markerat: lugnt och ljust */
  .info.blank { box-shadow:0 0 0 1px var(--line); }
  .info.blank .ihead { background:var(--soft); color:var(--muted); border-bottom:0; padding:12px; }
  .info.blank .ititle { font-size:12px; font-weight:400; color:var(--muted); white-space:normal; }
  .info.blank .ihead .icon { color:var(--muted); }
  .icards { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:10px 12px 12px; align-items:start; }
  .icards:empty { display:none; }
  .icard { background:var(--soft); border-radius:7px; padding:6px 8px; min-width:0; }
  .icard .l { font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }
  .icard .v { font-size:13px; font-weight:700; color:var(--ink); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icard .v.done { color:#2e7d32; }
  .icard .v.blank { color:#b5bec6; font-weight:400; }
  .imulti { display:flex; flex-wrap:wrap; gap:5px; grid-column:1 / -1; }
  .imulti span { font-size:11px; padding:2px 8px; border-radius:10px; background:var(--soft); }
  .imulti i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; background:var(--c); }
  .icfg { margin:0 12px 12px; border-top:1px dashed var(--line); padding-top:10px; }
  .cfglist { max-height:180px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  .cfglist .grp { font-size:10px; text-transform:uppercase; color:var(--muted); margin:6px 0 2px; letter-spacing:.04em; }
  .cfglist label { display:flex; gap:6px; align-items:center; color:var(--ink); font-size:12px; margin:2px 0; }
  .cfglist label small { color:var(--muted); margin-left:auto; padding-left:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%; }

  /* Inställningar & felsökning */
  .drawer { background:var(--soft); border-bottom:1px solid var(--line); padding:12px; }
  .drawer h3 { margin:0 0 8px; font-size:12px; color:var(--navy); }
  .drawer .f { margin-bottom:9px; }
  .drawer .btn { padding:6px 12px; }
  #log { background:#fff; border:1px solid var(--line); border-radius:6px; height:220px; overflow:auto; font:11px/1.35 Consolas,monospace; padding:6px; white-space:pre-wrap; word-break:break-all; margin:0 0 8px; }
  #log .e { color:#b00020; } #log .r { color:var(--navy); }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="PMJ Service">
  <span class="name">4D</span>
  <span class="sp"></span>
  <span id="dot" class="dot" title=""></span>
  <button id="btnLang" class="icon" title="Kieli / Språk">FI</button>
  <button id="btnSetup" class="icon" title="">⚙</button>
</header>
<div class="stripe"></div>

<div id="setup" class="drawer" hidden>
  <h3 data-t="setupTitle"></h3>
  <div class="f"><label for="libId" data-t="libId"></label>
    <div class="row" style="margin:0"><input id="libId" type="text" placeholder="4d13376b0d38…"><button id="btnLib" class="btn" style="flex:none" data-t="load"></button></div></div>
  <div class="row" style="margin:0 0 9px">
    <div><label for="defId" data-t="pset"></label><select id="defId"><option value="">–</option></select></div>
    <div><label for="statusKey" data-t="statusField"></label><select id="statusKey"><option value="">–</option></select></div>
  </div>
  <div class="f"><label for="linkTpl" data-t="linkTpl"></label><input id="linkTpl" type="text" placeholder="frn:…{guid}">
    <div class="hint" data-t="linkHint"></div>
    <button id="btnDiscover" class="btn ghost" style="margin-top:6px" data-t="discover"></button></div>
  <div class="f"><label for="region" data-t="region"></label>
    <select id="region">
      <option value="https://pset-api.eu-west-1.connect.trimble.com/v1">EU (eu-west-1)</option>
      <option value="https://pset-api.connect.trimble.com/v1">Global</option>
      <option value="https://pset-api.us-east-1.connect.trimble.com/v1">US (us-east-1)</option>
      <option value="https://pset-api.ap-southeast-1.connect.trimble.com/v1">Asia (ap-southeast-1)</option>
      <option value="https://pset-api.ap-southeast-2.connect.trimble.com/v1">Australia (ap-southeast-2)</option>
    </select></div>
  <button id="btnSetupDone" class="btn" data-t="done"></button>
</div>

<nav>
  <button id="tabView" class="on" data-t="tabView"></button>
  <button id="tabFill" data-t="tabFill"></button>
  <button id="tab4d" data-t="tab4d"></button>
</nav>

<main>
  <div id="paneView">
    <div class="bar">
      <button id="btnColor" class="btn" data-t="refresh"></button>
      <button id="btnReset" class="btn ghost" data-t="clear"></button>
    </div>
    <div id="cards" class="cards"></div>
    <div id="cardsEmpty" class="empty" data-t="emptyView"></div>
    <div id="cardsHint" class="hint" data-t="cardsHint" hidden></div>
  </div>

  <div id="paneFill" hidden>
    <div class="sel"><span id="selCount">0</span> <small data-t="selected"></small></div>
    <div id="statusGrid" class="grid"></div>
    <div id="autoRow" class="auto" hidden>
      <label for="autoDate" id="autoLabel"></label>
      <input id="autoDate" type="date">
      <div id="autoNote" class="hint" style="margin-top:4px"></div>
    </div>
    <button id="btnBrush" class="brush"></button>
    <div class="row" id="plannedRow">
      <div><label for="dateVal" id="plannedLabel">Suunniteltu Asennuspäivä</label><input id="dateVal" type="date"></div>
    </div>
    <div id="weekHint" class="hint" hidden></div>
    <button id="btnWrite" class="btn full"></button>
  </div>
  <div id="pane4d" hidden>
    <div class="seg"><button id="mSite" class="on" data-t="modeSite"></button><button id="mChain" data-t="modeChain"></button></div>
    <div id="tlBody">
      <div class="wkhead"><span id="wkTitle" class="wk"></span><span id="wkDates" class="hint"></span></div>
      <div id="strip" class="strip"></div>
      <div class="legend"><span><i style="background:#9fdcec"></i><span data-t="lgPlanned"></span></span><span><i style="background:#3aa845"></i><span data-t="lgInstalled"></span></span></div>
      <div class="ctrl">
        <button id="tlPrev" class="btn ghost" title="←">‹</button>
        <button id="tlPlay" class="btn"></button>
        <button id="tlNext" class="btn ghost" title="→">›</button>
        <button id="tlToday" class="btn ghost" data-t="today"></button>
      </div>
      <div id="tlStats" class="cards"></div>
      <label class="switch"><input type="checkbox" id="showUpcoming"> <span data-t="showUpcoming"></span></label>
    </div>
    <div id="tlEmpty" class="empty" hidden></div>
    <button id="tlReload" class="icon" style="margin-top:8px" data-t="reload"></button>
  </div>
</main>


<div style="padding:0 12px 10px"><button id="btnDebug" class="icon" data-t="debug"></button></div>
<div id="debug" class="drawer" hidden>
  <pre id="log"></pre>
  <button id="btnProps" class="btn ghost" data-t="props"></button>
  <button id="btnCopy" class="btn ghost" data-t="copy"></button>
  <button id="btnClear" class="btn ghost" data-t="clearLog"></button>
  <button id="btnToken" class="btn ghost" data-t="token"></button>
</div>

<div class="infowrap"><section id="info" class="info">
  <div class="ihead">
    <div class="iname"><div id="infoTitle" class="ititle"></div><div id="infoMark" class="imark"></div></div>
    <button id="infoStatus" class="ichip" hidden></button>
    <button id="btnInfoCfg" class="icon" title="">⚙</button>
  </div>
  <div id="infoMenu" class="imenu" hidden></div>
  <div id="infoCards" class="icards"></div>
  <div id="infoToast" class="itoast" hidden></div>
  <div id="infoCfg" class="icfg" hidden>
    <label for="cfgMark" data-t="cfgMark"></label>
    <select id="cfgMark"></select>
    <label style="margin-top:10px" data-t="cfgFields"></label>
    <div id="cfgFields" class="cfglist"></div>
  </div>
</section></div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script src="app.js"></script>
</body>
</html>
